services:
  rancher:
    image: rancher/rancher:v2.15.3
    container_name: rancher
    privileged: true
    ports:
      - "8443:443"
    volumes:
      - rancher-data:/var/lib/rancher
    environment:
      - CATTLE_BOOTSTRAP_PASSWORD=${RANCHER_BOOTSTRAP_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockefile
    container_name: frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  rancher-data:
